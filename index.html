<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO Dissertativo-Argumentativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎴 UNO REDAÇÃO</h1>
    <p>Argumente para vencer!</p>
</header>

<main>
    <section class="painel">
        <h2>Jogo Dissertativo-Argumentativo</h2>
        <p>Responda aos desafios e acumule pontos!</p>

        <div class="informacoes">
            <span>Pontos: <strong id="pontos">0</strong></span>
            <span>Cartas restantes: <strong id="restantes">7</strong></span>
        </div>

        <div id="carta" class="carta">
            <h2 id="categoria">TESE</h2>
            <p id="desafio">
                Apresente sua opinião sobre um tema.
            </p>
        </div>

        <textarea id="resposta"
        placeholder="Digite sua resposta argumentativa..."></textarea>

        <div class="botoes">
            <button onclick="jogar()">Jogar carta</button>
            <button onclick="comprar()">Comprar carta</button>
        </div>

        <p id="mensagem"></p>
    </section>
</main>

<footer>
    <p>UNO REDAÇÃO - Aprendendo a argumentar!</p>
</footer>

<script src="script.js"></script>
</body>
</html>
